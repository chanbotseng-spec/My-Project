<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <table align="center" border="1" width="60%" cellspacing="0" cellpadding="10px">
        <tr>
            <th colspan="5">Table</th>
        </tr>
        <tr>
            <th rowspan="2">A</th>
            <th colspan="3">B</th>
            <th>C</th>
        </tr>
        <tr>
            <th>D</th>
            <th>E</th>
            <th colspan="2">F</th>
        </tr>
        <tr>
            <th colspan="3">G</th>
            <th colspan="2" rowspan="2">H</th>
        </tr>
        <tr>
            <th colspan="2">I</th>
            <th>J</th>
        </tr>
        <tr>
            <th colspan="2" rowspan="2">K</th>
            <th>L</th>
            <th>M</th>
            <th>N</th>
        </tr>
        <tr>
            <th>O</th>
            <th colspan="2">P</th>
        </tr>
    </table>

</body>
</html>
